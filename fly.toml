# Fly.io deploy config (https://fly.io).
# Deploy with:  fly launch --no-deploy   (once, to create the app)
#               fly deploy
# EasyOCR + torch need memory: use a machine with >= 2GB RAM.
app = "visionscore-dashboard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
